# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. 4GB heap is enough for typical Android
# builds; reduce if your device is RAM-constrained.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Performance: keep Gradle daemon alive, build modules in parallel, reuse the
# task output cache between builds, and only configure projects we need.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin: use incremental compilation and a long-running compiler daemon.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2048m

# Android: AndroidX, non-transitive R, and disable Jetifier (slows builds).
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
